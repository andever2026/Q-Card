name: Deploy site

# Publishes the site after the Check workflow passes on a push to main or beta:
#   main  → https://andever2026.github.io/Q-Card/        (the live site, files as committed)
#   beta  → https://andever2026.github.io/Q-Card/beta/   (built with `node tools/build.mjs --beta`)
# Needs Settings → Pages → Source set to "GitHub Actions". A workflow_run job runs on the default branch,
# so the github-pages environment's branch rule allows it whichever branch was pushed.
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: beta
          path: beta
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - name: Build beta
        working-directory: beta
        run: |
          npm ci
          node tools/build.mjs --beta
      - name: Put the site together
        run: |
          mkdir -p _site/beta
          git -C live archive HEAD | tar -x -C _site
          git -C beta archive HEAD | tar -x -C _site/beta
          cp beta/index.html _site/beta/
          cp beta/js/*.js _site/beta/js/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
