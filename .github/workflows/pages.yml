name: Deploy site

# Publishes the site after the Check workflow passes on a push to main, beta or dev:
#   main  → https://andever2026.github.io/Q-Card/        (the live site, files as committed)
#   beta  → https://andever2026.github.io/Q-Card/beta/   (fixes for the live site; built with `node tools/build.mjs --beta`)
#   dev   → https://andever2026.github.io/Q-Card/dev/    (new features; built with `node tools/build.mjs --dev`)
# Every deploy builds all three, since one upload replaces the whole site.
# Needs Settings → Pages → Source set to "GitHub Actions". A workflow_run job runs on the default branch,
# so the github-pages environment's branch rule allows it whichever branch was pushed.
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main, beta, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: live
      - uses: actions/checkout@v7
        with:
          ref: beta
          path: beta
      - uses: actions/checkout@v7
        with:
          ref: dev
          path: dev
      - uses: actions/setup-node@v7
        with:
          node-version-file: beta/.nvmrc
          cache: npm
          cache-dependency-path: |
            beta/package-lock.json
            dev/package-lock.json
      - name: Build the test sites
        run: |
          for site in beta dev; do
            (cd $site && npm ci && node tools/build.mjs --$site)
          done
      - name: Put the site together
        run: |
          mkdir -p _site
          git -C live archive HEAD | tar -x -C _site
          for site in beta dev; do
            mkdir -p _site/$site
            git -C $site archive HEAD | tar -x -C _site/$site
            cp $site/index.html _site/$site/
            cp $site/js/*.js _site/$site/js/
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
