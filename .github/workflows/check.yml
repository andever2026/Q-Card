name: Check

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Built files match src/
        run: npm run check

  # The full browser tests (test/public/run.mjs) run before anything goes into main, which is the live site.
  # Pushes to beta skip them so the beta link updates quickly.
  browser-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: node test/public/run.mjs
        env:
          PLAYWRIGHT_DIR: ${{ github.workspace }}/node_modules/playwright
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shots
          path: build/test-shots
          retention-days: 7

  # The same page against the real Firebase SDK and firestore.rules, on the Firebase emulators (test/emulator/run.mjs),
  # also before anything goes into main.
  emulator-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The Firestore emulator runs on Java (21 or later for firebase-tools 14).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Both in one npm install: a second `npm install --no-save` would remove what the first one added.
      - name: Install Playwright, Chromium and the Firebase CLI
        run: |
          npm install --no-save playwright@1.56.1 firebase-tools@14.27.0
          npx playwright install --with-deps chromium
      - name: Emulator tests
        run: npx firebase emulators:exec --config test/emulator/firebase.json --only auth,firestore --project demo-qcard "node test/emulator/run.mjs"
        env:
          PLAYWRIGHT_DIR: ${{ github.workspace }}/node_modules/playwright
